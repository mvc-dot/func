<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4B73A">
<meta name="description" content="A private room for your event. Guests scan a code and they're in — no app, no signup.">
<title>Func</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>:root {
  --paper: #EDEFF6;
  --card: #FFFFFF;
  --ink: #1A1E3A;
  --muted: #62678A;
  --line: #D5D8E6;
  --stub: #F4B73A;
  --stub-ink: #2A1F05;
  --band: #C92F6E;
  --band-ink: #FFFFFF;
  --mine: #1A1E3A;
  --mine-ink: #F3F4FA;
  --theirs: #FFFFFF;
  --danger: #B3261E;
  --display: "Bricolage Grotesque", "Avenir Next Condensed", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --r-sm: 6px;
  --r-md: 14px;
  --r-lg: 22px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13152A; --card: #1E2240; --ink: #ECEEF8; --muted: #9DA2C4; --line: #2E3358;
    --mine: #ECEEF8; --mine-ink: #13152A; --theirs: #1E2240; --band: #E8508E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13152A; --card: #1E2240; --ink: #ECEEF8; --muted: #9DA2C4; --line: #2E3358;
  --mine: #ECEEF8; --mine-ink: #13152A; --theirs: #1E2240; --band: #E8508E; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font: 17px/1.45 var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--band); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- The ticket: the one bold element ---------- */
.ticket {
  --notch: 11px;
  position: relative; display: grid; grid-template-columns: 1fr auto;
  background: var(--stub); color: var(--stub-ink);
  border-radius: var(--r-md);
  -webkit-mask:
    radial-gradient(circle var(--notch) at calc(100% - var(--stubw)) 0, #0000 98%, #000) top / 100% 51% no-repeat,
    radial-gradient(circle var(--notch) at calc(100% - var(--stubw)) 100%, #0000 98%, #000) bottom / 100% 51% no-repeat;
          mask:
    radial-gradient(circle var(--notch) at calc(100% - var(--stubw)) 0, #0000 98%, #000) top / 100% 51% no-repeat,
    radial-gradient(circle var(--notch) at calc(100% - var(--stubw)) 100%, #0000 98%, #000) bottom / 100% 51% no-repeat;
  --stubw: 104px;
}
.ticket-main { padding: 14px 18px 14px 18px; min-width: 0; }
.ticket-stub {
  width: var(--stubw); padding: 12px 10px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; gap: 2px;
  background-image: linear-gradient(var(--stub-ink) 50%, transparent 0);
  background-size: 2px 8px; background-repeat: repeat-y; background-position: left;
}
.ticket-stub .when { font: 800 22px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.ticket-stub .what { font-size: 13px; opacity: .8; }
.room-title {
  font: 800 clamp(24px, 6.4vw, 34px)/1.02 var(--display);
  letter-spacing: -.02em; margin: 0;
  overflow-wrap: anywhere;
}
.room-sub { font-size: 14px; margin-top: 4px; opacity: .82; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #3E8E41; margin-right: 6px; vertical-align: 1px; }
.dot.off { background: var(--danger); }

/* ---------- Landing ---------- */
.landing { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
.landing h1 {
  font: 800 clamp(40px, 11vw, 64px)/.95 var(--display); letter-spacing: -.035em; margin: 8px 0 16px;
}
.landing .lede { font-size: 19px; color: var(--muted); max-width: 34ch; margin: 0 0 28px; }
.landing .ticket { --stubw: 96px; margin-bottom: 28px; }
.form { display: grid; gap: 18px; }
.field label { display: block; font-weight: 700; margin-bottom: 6px; }
.field .hint { font-size: 14px; color: var(--muted); margin-top: 4px; }
.input, .select {
  width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: var(--r-sm);
  background: var(--card); font-size: 17px;
}
.input:focus, .select:focus { border-color: var(--ink); outline: none; }
.btn {
  border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 700; font-size: 17px;
  background: var(--band); color: var(--band-ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 9px 14px; font-size: 15px; }
.btn.block { width: 100%; }
.how { margin-top: 40px; display: grid; gap: 14px; color: var(--muted); font-size: 16px; padding: 0; list-style: none; counter-reset: how; }
.how li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; counter-increment: how; }
.how li::before { content: counter(how); font: 800 18px/1.3 var(--display); color: var(--ink); }

/* ---------- Room layout ---------- */
.room { height: 100dvh; display: grid; grid-template-rows: auto auto 1fr auto; max-width: 720px; margin: 0 auto; }
.room-head { padding: max(10px, env(safe-area-inset-top)) 12px 0; }
.tabs { display: flex; gap: 4px; padding: 10px 12px 6px; align-items: center; }
.tab {
  border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 700; color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.tabs .spacer { flex: 1; }
.icon-btn {
  border: 0; background: transparent; width: 40px; height: 40px; border-radius: 50%;
  display: inline-grid; place-items: center; color: var(--ink);
}
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.icon-btn svg { width: 22px; height: 22px; }
.pane { overflow-y: auto; overscroll-behavior: contain; padding: 4px 12px 12px; }

/* chat */
.msgs { display: flex; flex-direction: column; gap: 2px; min-height: 100%; justify-content: flex-end; }
.empty { text-align: center; color: var(--muted); margin: auto; padding: 40px 16px; max-width: 32ch; }
.empty strong { display: block; color: var(--ink); font: 800 22px/1.1 var(--display); margin-bottom: 6px; }
.sep { text-align: center; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
.msg { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 8px; align-items: end; max-width: 86%; position: relative; }
.msg + .msg.first { margin-top: 10px; }
.msg .av {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; font-size: 14px; color: #fff; visibility: hidden;
}
.msg.last .av { visibility: visible; }
.msg .who { font-size: 13px; color: var(--muted); margin: 0 0 2px 12px; display: none; }
.msg.first .who { display: block; }
.bubble {
  background: var(--theirs); padding: 9px 13px; border-radius: 18px; overflow-wrap: anywhere; white-space: pre-wrap;
  box-shadow: 0 0 0 1px var(--line);
}
.msg.mine { align-self: flex-end; grid-template-columns: minmax(0, 1fr); }
.msg.mine .av, .msg.mine .who { display: none; }
.msg.mine .bubble { background: var(--mine); color: var(--mine-ink); box-shadow: none; }
.msg.sending .bubble { opacity: .6; }
.msg.failed .bubble { box-shadow: 0 0 0 2px var(--danger); }
.msg .status { font-size: 12px; color: var(--danger); text-align: right; margin-top: 2px; }
.msg .photo {
  display: block; border: 0; padding: 0; border-radius: 16px; overflow: hidden; background: var(--line) center / cover no-repeat;
  width: min(260px, 62vw); position: relative;
}
.msg .photo img, .grid .cell img { display: block; width: 100%; height: 100%; object-fit: cover; }
.msg .photo .blur, .grid .cell .blur { filter: blur(12px); transform: scale(1.1); }
.msg-actions { position: absolute; top: -6px; right: -6px; opacity: 0; }
.msg:hover .msg-actions, .msg:focus-within .msg-actions { opacity: 1; }
.msg.mine .msg-actions { right: auto; left: -34px; top: 50%; transform: translateY(-50%); }
.more { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--card); box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; }
@media (hover: none) { .msg-actions { opacity: 1; } .msg:not(.mine) .msg-actions { right: -36px; top: 50%; transform: translateY(-50%); } .more { background: transparent; box-shadow: none; color: var(--muted); } }

/* photos grid */
.grid-head { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 10px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.grid .cell { aspect-ratio: 1; border: 0; padding: 0; background: var(--line); overflow: hidden; border-radius: 2px; }

/* composer */
.composer {
  display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: end;
  padding: 8px 12px max(10px, env(safe-area-inset-bottom)); background: var(--paper);
  border-top: 1px solid var(--line);
}
.composer textarea {
  resize: none; border: 1.5px solid var(--line); border-radius: 22px; padding: 10px 16px; background: var(--card);
  max-height: 140px; line-height: 1.35; font-size: 17px;
}
.composer textarea:focus { outline: none; border-color: var(--ink); }
.send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--band); color: var(--band-ink); display: grid; place-items: center; }
.send:disabled { opacity: .4; }
.cam { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); display: grid; place-items: center; }
.closed-bar { padding: 14px 16px max(14px, env(safe-area-inset-bottom)); text-align: center; color: var(--muted); border-top: 1px solid var(--line); }
.banner { margin: 6px 12px 0; padding: 8px 12px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--danger) 12%, var(--paper)); color: var(--ink); font-size: 14px; }

/* join card */
.join { max-width: 480px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px 40px; }
.join .ticket { margin-bottom: 24px; }
.join p { color: var(--muted); }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgb(10 12 30 / .45); display: grid; align-items: end; justify-items: center; z-index: 10; }
.sheet {
  background: var(--card); width: min(520px, 100%); border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding: 20px 20px max(24px, env(safe-area-inset-bottom)); max-height: 92dvh; overflow: auto;
  animation: rise .22s ease-out;
}
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: var(--r-lg); } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet h2 { font: 800 26px/1.1 var(--display); letter-spacing: -.02em; margin: 0 0 6px; }
.sheet p { color: var(--muted); margin: 0 0 16px; }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; }
.qr { background: #fff; border-radius: var(--r-md); padding: 16px; display: grid; place-items: center; margin: 4px 0 16px; }
.qr svg { width: min(280px, 70vw); height: auto; display: block; }
.linkbox { font-size: 14px; color: var(--muted); word-break: break-all; background: var(--paper); padding: 10px 12px; border-radius: var(--r-sm); margin-bottom: 14px; }
.menu-list { display: grid; gap: 4px; margin-top: 8px; }
.menu-list button { text-align: left; border: 0; background: transparent; padding: 14px 12px; border-radius: var(--r-sm); font-weight: 700; }
.menu-list button:hover { background: var(--paper); }
.menu-list button.danger { color: var(--danger); }
.relays { font-size: 14px; color: var(--muted); margin-top: 16px; display: grid; gap: 4px; }

/* lightbox */
.lightbox { position: fixed; inset: 0; background: #000; z-index: 20; display: grid; grid-template-rows: auto 1fr; }
.lightbox header { display: flex; justify-content: space-between; align-items: center; padding: max(10px, env(safe-area-inset-top)) 12px 10px; color: #fff; gap: 8px; }
.lightbox header .icon-btn { color: #fff; }
.lightbox .cap { font-size: 14px; opacity: .8; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; margin: auto; display: block; }
.lightbox .stage { display: grid; place-items: center; overflow: hidden; }

#toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 15px;
  transition: .2s; pointer-events: none; z-index: 30; max-width: calc(100% - 32px); text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* print: the table card */
.print-card { display: none; }
@media print {
  body { background: #fff; }
  #app, #toast, .scrim > .sheet > :not(.print-card) { display: none !important; }
  .scrim { position: static; background: none; display: block; }
  .sheet { box-shadow: none; padding: 0; max-height: none; width: 100%; }
  .print-card { display: block; text-align: center; color: #1A1E3A; padding-top: 40px; }
  .print-card h1 { font: 800 48px/1 var(--display); margin: 0 0 12px; letter-spacing: -.02em; }
  .print-card p { font-size: 22px; margin: 0 0 28px; color: #1A1E3A; }
  .print-card svg { width: 360px; height: 360px; }
  .print-card .foot { font-size: 16px; margin-top: 20px; color: #555; }
}
.ticket.flat { -webkit-mask: none; mask: none; display: block; }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="sheet-root"></div>
<div id="toast" role="status"></div>
